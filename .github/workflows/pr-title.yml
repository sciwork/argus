name: Validate PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  commitizen:
    name: Commitizen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --group dev cz check --message "$PR_TITLE"
